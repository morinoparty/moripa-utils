$schema: https://raw.githubusercontent.com/morinoparty/fukurou/v2/schema/scenario.v2.json
name: /ticket opens the ticket dialog
tags: [ticket, dialog]
steps:
  # 参加直後はクライアントがまだ入力を受け付けず、打った文字がキー操作として扱われることがある
  - { action: wait, seconds: 10 }
  - { on: Alice, action: chat, text: "/ticket" }
  # コマンドが届いていないのに assert_no_log だけで通らないよう、届いたことを先に確かめる
  - { on: server, action: wait_for_log, pattern: "Alice issued server command: /ticket", timeout: 10 }
  - { action: wait, seconds: 3 }
  # コマンドの実行中や Dialog の組み立てで例外が出ていない (MoripaUtils のコードを含むスタックトレースも検出する)
  - { on: server, action: assert_no_log, pattern: "Exception executing command|Unhandled exception|at party\\.morino\\.moripautils\\." }
  # コマンドが未登録 / プラグインの有効化に失敗 / 権限が無い、のいずれでもない (チャットの行に限定して誤検知を避ける)
  - { on: Alice, action: assert_no_log, pattern: "\\[CHAT\\] .*(Unknown or incomplete command|現在お問い合わせを受け付けていません|permission)" }
  # fukurou には Dialog の表示を直接確かめる手段が無いため、スクリーンショットで目視できるようにする
  - { on: Alice, action: screenshot, name: ticket-dialog }
  # Escape では Dialog が閉じきらず次のテストの入力を奪うことがあるため、サーバーから確実に閉じる
  # (fukurou のテスト間のリセットはサーバーが開いた Dialog までは閉じない)
  - { on: server, action: command, command: "dialog clear Alice" }
