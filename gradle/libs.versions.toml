[versions]
paper = "26.2.build.129-stable"
velocity = "4.2.0"
kotlin = "2.4.20"
mccoroutine = "2.23.0"
cloud = "2.2.0-SNAPSHOT"
cloudPaper = "2.1.0-SNAPSHOT"
koin = "4.2.2"
coroutine = "1.11.0"
serialization = "1.11.0"
ktlint = "14.2.0"
mockk = "1.14.11"
junit = "6.1.3"
mockBukkit = "4.116.1"
prometheus = "1.9.0"
typesafeConfig = "1.4.9"
exposed = "1.5.0"
# テスト用。Paper では JAR に同梱せず、サーバー同梱の sqlite-jdbc (Paper 26.x では 3.49.1.0) を実行時に使う
sqlite = "3.53.4.0"
mineauth = "0.5.1"

[libraries]
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
velocity-api = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }

cloud = { group = "org.incendo", name = "cloud-core", version.ref = "cloud" }
cloud-annotations = { group = "org.incendo", name = "cloud-annotations", version.ref = "cloud" }
cloud-kotlin-coroutines-annotations = { group = "org.incendo", name = "cloud-kotlin-coroutines-annotations", version.ref = "cloud" }
cloudPaper = { group = "org.incendo", name = "cloud-paper", version.ref = "cloudPaper" }
cloudVelocity = { group = "org.incendo", name = "cloud-velocity", version.ref = "cloudPaper" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json-jvm", version.ref = "serialization" }
# 設定ファイル (config.conf) を HOCON で読み書きするための kotlinx.serialization フォーマットと Typesafe Config 本体
kotlinx-serialization-hocon = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-hocon", version.ref = "serialization" }
typesafe-config = { group = "com.typesafe", name = "config", version.ref = "typesafeConfig" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core-jvm", version.ref = "coroutine" }

mccoroutine-bukkit-api = { group = "com.github.shynixn.mccoroutine", name = "mccoroutine-bukkit-api", version.ref = "mccoroutine" }
mccoroutine-bukkit-core = { group = "com.github.shynixn.mccoroutine", name = "mccoroutine-bukkit-core", version.ref = "mccoroutine" }
mccoroutine-velocity-api = { group = "com.github.shynixn.mccoroutine", name = "mccoroutine-velocity-api", version.ref = "mccoroutine" }
mccoroutine-velocity-core = { group = "com.github.shynixn.mccoroutine", name = "mccoroutine-velocity-core", version.ref = "mccoroutine" }

koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }

# Prometheus client_java 1.x (メトリクスのコア / HTTP エクスポーター / JVM 計測 / テキスト形式出力)
prometheus-core = { group = "io.prometheus", name = "prometheus-metrics-core", version.ref = "prometheus" }
prometheus-httpserver = { group = "io.prometheus", name = "prometheus-metrics-exporter-httpserver", version.ref = "prometheus" }
prometheus-jvm = { group = "io.prometheus", name = "prometheus-metrics-instrumentation-jvm", version.ref = "prometheus" }
prometheus-textformats = { group = "io.prometheus", name = "prometheus-metrics-exposition-textformats", version.ref = "prometheus" }

# チケット機能の永続化 (Exposed + SQLite)
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-java-time = { group = "org.jetbrains.exposed", name = "exposed-java-time", version.ref = "exposed" }
sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }

# MineAuth の公開 API (Web からのチケット操作などで連携する。実行時は MineAuth プラグイン側のクラスを使う)
mineauth-api = { group = "party.morino", name = "mineauth-api", version.ref = "mineauth" }

mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mock-bukkit = { group = "org.mockbukkit.mockbukkit", name = "mockbukkit-v26.2", version.ref = "mockBukkit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit5 = { group = "io.insert-koin", name = "koin-test-junit5", version.ref = "koin" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
resource-factory = { id = "xyz.jpenilla.resource-factory", version = "1.4.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
spotless = { id = "com.diffplug.spotless", version = "8.10.3" }

[bundles]
commands-paper = ["cloud", "cloudPaper", "cloud-annotations", "cloud-kotlin-coroutines-annotations"]
commands-velocity = ["cloud", "cloudVelocity", "cloud-annotations", "cloud-kotlin-coroutines-annotations"]
coroutines-bukkit = ["mccoroutine-bukkit-api", "mccoroutine-bukkit-core", "kotlinx-coroutines-core"]
coroutines-velocity = ["mccoroutine-velocity-api", "mccoroutine-velocity-core", "kotlinx-coroutines-core"]
junit-jupiter = ["junit-jupiter", "junit-platform-launcher"]
koin-test = ["koin-test", "koin-test-junit5"]
config = ["kotlinx-serialization-hocon", "typesafe-config"]
database = ["exposed-core", "exposed-jdbc", "exposed-java-time", "sqlite"]
prometheus = ["prometheus-core", "prometheus-httpserver", "prometheus-jvm"]
